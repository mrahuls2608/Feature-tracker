# Full local stack: MongoDB, Redis, API, background worker and web dashboard.
#   docker compose up --build
# For MongoDB Atlas / managed Redis, set MONGODB_URI / REDIS_URL and drop the mongo/redis services.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 10s, retries: 5 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5 }
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: &apienv
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/featuretrack}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
      RUN_WORKERS_INLINE: "false"
    ports: ["4000:4000"]
    depends_on: { mongo: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "server/src/worker.js"]
    environment: *apienv
    depends_on: { mongo: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:4000}" } }
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  mongo-data:
  redis-data:
